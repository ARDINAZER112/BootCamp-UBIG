<body>
  <h2># Episode 09 - Color</h2>

  <p>Cara menulis warna:</p>
  <p>
    <ul><li>- Nama: <code>red</code>, <code>tomato</code> · Hex: <code>#ff0000</code> / <code>#f00</code> · RGB: <code>rgb(255 0 0)</code> · HSL: <code>hsl(0 100% 50%)</code></li>
        <li>- Properti: <code>color</code> (teks), <code>background-color</code>, <code>border-color</code>.</li>
      </ul>
    </p>

  <div class="k nama">Nama: tomato</div>
  <div class="k hex">Hex: #3182ce</div>
  <div class="k rgb">RGB: rgb(72, 187, 120)</div>
  <div class="k hsl">HSL: hsl(270, 60%, 60%)</div>
