<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonus Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>justify-content & align-items</h3>
  <div class="flex tengah"><div>A</div><div>B</div><div>C</div></div>
  <h3>space-between + gap</h3>
  <div class="flex antar"><div>A</div><div>B</div><div>C</div></div>
  <h3>flex-grow & wrap</h3>
  <div class="flex wrap"><div class="tumbuh">grow 2</div><div>1</div><div>1</div><div>240px</div><div>240px</div></div>
  <h3>flex-direction: column</h3>
  <div class="flex kolom"><div>1</div><div>2</div></div>
</body>
</html>
