<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout - Grid View</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>Grid 12 kolom (CSS Grid)</h3>
  <div class="row">
    <div class="col-3">3</div><div class="col-6">6</div><div class="col-3">3</div>
  </div>
  <div class="row">
    <div class="col-4">4</div><div class="col-4">4</div><div class="col-4">4</div>
  </div>
  <div class="row">
    <div class="col-12">12</div>
  </div>
  <p>Di layar &lt; 600px semua kolom menjadi 12 (satu kolom penuh).</p>
</body>
</html>
