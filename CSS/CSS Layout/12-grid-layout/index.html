<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>1. Kolom dasar</h3>
  <div class="grid dasar"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>
  <h3>2. Span</h3>
  <div class="grid dasar"><div class="lebar">span 2</div><div>2</div><div>3</div><div>4</div></div>
  <h3>3. Grid template areas (layout halaman)</h3>
  <div class="halaman">
    <header>Header</header><nav>Nav</nav><main>Main</main><aside>Aside</aside><footer>Footer</footer>
  </div>
</body>
</html>
